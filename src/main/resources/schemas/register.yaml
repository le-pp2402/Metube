$schema: 'https://json-schema.org/draft/2020-12/schema'
title: 'register validate'
type: 'object'
properties:
  username:
    type: 'string'
    minLength: 3
    maxLength: 30
    pattern: '^[a-zA-Z0-9_]+$'
  email:
    type: 'string'
    format: 'email'
  password:
    type: 'string'
    minLength: 6
    maxLength: 50
required:
  - 'username'
  - 'email'
  - 'password'
