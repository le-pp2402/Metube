services:
  redis:
    image: redis:8.6.3-trixie
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
      ]
    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - auth-network

  postgre:
    image: postgres:15.5-alpine
    container_name: postgre
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgre_data:/var/lib/postgresql/data

volumes:
  redis_data:
  redis_insight_data:
  postgre_data:

networks:
  auth-network:
    driver: bridge
