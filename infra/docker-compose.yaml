services:
  redis:
    image: redis:8.6.3-trixie
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - auth-network

volumes:
  redis_data:
  redis_insight_data:

networks:
  auth-network:
    driver: bridge
